plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - spec/dummy/**/*
    - lib/**
    - bin/**
    - config/**/*
    - vendor/**/*
    - Rakefile

Layout/LineLength:
  Max: 150

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - spec/**/*
RSpec/MultipleMemoizedHelpers:
  Exclude:
    - spec/**/*
RSpec/MultipleExpectations:
  Exclude:
    - spec/**/*
RSpec/ExampleLength:
  Exclude:
    - spec/**/*
RSpec/NestedGroups:
  Exclude:
    - spec/**/*
RSpec/ContextWording:
  Exclude:
    - spec/**/*
Metrics/MethodLength:
  Exclude:
    - lib/middleware/spree_redirections/redirections_middleware.rb